name: helm-lint

# Lints the Helix Helm chart and renders it with both the default and the
# production values files, so template errors are caught in CI (the chart cannot
# be validated against a live cluster). Runs only when the chart changes.

on:
  push:
    paths:
      - "infra/helm/**"
      - ".github/workflows/helm-lint.yml"
  pull_request:
    paths:
      - "infra/helm/**"
      - ".github/workflows/helm-lint.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: helm lint (default values)
        run: helm lint infra/helm/helix
      - name: helm lint (production values)
        run: helm lint infra/helm/helix --values infra/helm/helix/values-prod.yaml
      - name: helm template (default values)
        run: helm template helix infra/helm/helix >/dev/null
      - name: helm template (production values)
        run: helm template helix infra/helm/helix --values infra/helm/helix/values-prod.yaml >/dev/null
