# Dev stack for the vertical slice. Qdrant is the only external dependency;
# SQLite, the span JSONL, and the LLM cache are all on the local filesystem.
#
#   make dev        # boot Qdrant
#   make dev-down   # tear it down (and drop the volume)
services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    ports:
      - "6333:6333" # REST / what the client's default url targets
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  qdrant_storage:
