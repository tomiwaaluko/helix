# Headless service for stable DNS (StatefulSet pods)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helix.fullname" . }}-clickhouse-headless
  labels:
    {{- include "helix.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "helix.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
  ports:
    - name: http
      port: {{ .Values.clickhouse.port }}
      targetPort: http
      protocol: TCP
    - name: native
      port: {{ .Values.clickhouse.nativePort }}
      targetPort: native
      protocol: TCP
---
# ClusterIP service for application access
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helix.fullname" . }}-clickhouse
  labels:
    {{- include "helix.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  type: ClusterIP
  selector:
    {{- include "helix.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
  ports:
    - name: http
      port: {{ .Values.clickhouse.port }}
      targetPort: http
      protocol: TCP
    - name: native
      port: {{ .Values.clickhouse.nativePort }}
      targetPort: native
      protocol: TCP
