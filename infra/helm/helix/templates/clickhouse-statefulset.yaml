apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helix.fullname" . }}-clickhouse
  labels:
    {{- include "helix.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  serviceName: {{ include "helix.fullname" . }}-clickhouse-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "helix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: clickhouse
  template:
    metadata:
      labels:
        {{- include "helix.labels" . | nindent 8 }}
        app.kubernetes.io/component: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image | quote }}
          imagePullPolicy: {{ .Values.clickhouse.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.clickhouse.port }}
              protocol: TCP
            - name: native
              containerPort: {{ .Values.clickhouse.nativePort }}
              protocol: TCP
          env:
            - name: CLICKHOUSE_DB
              value: {{ .Values.clickhouse.database | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user | quote }}
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
            {{- if .Values.secrets.clickhousePassword }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "helix.secretName" . }}
                  key: CLICKHOUSE_PASSWORD
            {{- end }}
          livenessProbe:
            exec:
              command:
                - clickhouse-client
                - --query
                - "SELECT 1"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.clickhouse.storageClassName }}
        storageClassName: {{ .Values.clickhouse.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.storage }}
