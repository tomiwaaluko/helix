apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helix.fullname" . }}-orchestrator
  labels:
    {{- include "helix.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  replicas: {{ .Values.orchestrator.replicaCount }}
  selector:
    matchLabels:
      {{- include "helix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        {{- include "helix.labels" . | nindent 8 }}
        app.kubernetes.io/component: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: "{{ .Values.orchestrator.image.repository }}:{{ .Values.orchestrator.image.tag }}"
          imagePullPolicy: {{ .Values.orchestrator.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.orchestrator.port }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.orchestrator.grpcPort }}
              protocol: TCP
          env:
            - name: HTTP_PORT
              value: {{ .Values.orchestrator.port | quote }}
            - name: GRPC_PORT
              value: {{ .Values.orchestrator.grpcPort | quote }}
            - name: HELIX_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "helix.secretName" . }}
                  key: HELIX_API_TOKEN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "helix.secretName" . }}
                  key: DATABASE_URL
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "helix.secretName" . }}
                  key: NATS_URL
            - name: CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "helix.secretName" . }}
                  key: CLICKHOUSE_URL
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "helix.secretName" . }}
                  key: S3_ENDPOINT
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "helix.secretName" . }}
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "helix.secretName" . }}
                  key: S3_SECRET_KEY
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
