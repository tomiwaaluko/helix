apiVersion: v1
kind: Service
metadata:
  name: {{ include "helix.fullname" . }}-orchestrator
  labels:
    {{- include "helix.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  type: ClusterIP
  selector:
    {{- include "helix.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
  ports:
    - name: http
      port: {{ .Values.orchestrator.port }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.orchestrator.grpcPort }}
      targetPort: grpc
      protocol: TCP
