apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helix.fullname" . }}-qdrant
  labels:
    {{- include "helix.labels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
spec:
  serviceName: {{ include "helix.fullname" . }}-qdrant-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "helix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: qdrant
  template:
    metadata:
      labels:
        {{- include "helix.labels" . | nindent 8 }}
        app.kubernetes.io/component: qdrant
    spec:
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image | quote }}
          imagePullPolicy: {{ .Values.qdrant.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.qdrant.port }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.qdrant.grpcPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.qdrant.storageClassName }}
        storageClassName: {{ .Values.qdrant.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.qdrant.storage }}
