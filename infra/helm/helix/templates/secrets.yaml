apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helix.secretName" . }}
  labels:
    {{- include "helix.labels" . | nindent 4 }}
type: Opaque
data:
  HELIX_API_TOKEN: {{ .Values.secrets.apiToken | b64enc | quote }}
  DATABASE_URL: {{ include "helix.databaseURL" . | b64enc | quote }}
  NATS_URL: {{ include "helix.natsURL" . | b64enc | quote }}
  REDIS_URL: {{ include "helix.redisURL" . | b64enc | quote }}
  QDRANT_URL: {{ include "helix.qdrantURL" . | b64enc | quote }}
  CLICKHOUSE_URL: {{ include "helix.clickhouseURL" . | b64enc | quote }}
  CLICKHOUSE_HTTP_URL: {{ include "helix.clickhouseHTTPURL" . | b64enc | quote }}
  S3_ENDPOINT: {{ include "helix.s3Endpoint" . | b64enc | quote }}
  S3_ACCESS_KEY: {{ .Values.minio.rootUser | b64enc | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.minioRootPassword | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  MINIO_ROOT_USER: {{ .Values.minio.rootUser | b64enc | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioRootPassword | b64enc | quote }}
  CLICKHOUSE_PASSWORD: {{ .Values.secrets.clickhousePassword | b64enc | quote }}
